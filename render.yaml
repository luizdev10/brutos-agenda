services:
  - type: web
    name: brutos-agenda
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /saude/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://brutos-agenda.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: brutos-db
          property: connectionString
databases:
  - name: brutos-db
    plan: free
