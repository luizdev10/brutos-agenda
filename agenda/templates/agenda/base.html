<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Brutos Agenda{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .btn, .form-control, .form-select { min-height: 44px; }
    .horario { min-width: 88px; min-height: 44px; }
  </style>
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3">
  <div class="container" style="max-width: 640px;">
    <h1 class="h4 mb-0">Barbearia Brutos</h1>
    {% block passo %}{% endblock %}
  </div>
</header>
<main class="container py-4" style="max-width: 640px;">
  {% block conteudo %}{% endblock %}
</main>
</body>
</html>
